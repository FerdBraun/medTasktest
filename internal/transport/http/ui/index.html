<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .task-card { transition: all 0.2s ease-in-out; }
        .task-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 leading-tight">Task Manager</h1>
                <p class="text-slate-500">Simple UI for managing your daily tasks.</p>
            </div>
            <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm">
                + New Task
            </button>
        </header>

        <!-- Task List Container -->
        <div id="task-list" class="grid gap-4">
            <!-- Tasks will be loaded here -->
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200">
                <div class="h-4 bg-slate-200 rounded w-1/4 mb-4"></div>
                <div class="h-3 bg-slate-100 rounded w-full mb-2"></div>
                <div class="h-3 bg-slate-100 rounded w-5/6"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Create/Edit -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-100">
                <h2 id="modal-title" class="text-xl font-semibold text-slate-900">Create Task</h2>
            </div>
            <form id="task-form" class="p-6 space-y-4">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
                    <input type="text" id="title" required class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                    <textarea id="description" rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                    <select id="status" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-white">
                        <option value="new">New</option>
                        <option value="in_progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="toggleModal(false)" class="flex-1 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-lg font-medium transition-colors">Cancel</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors shadow-sm">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/tasks';
        const taskList = document.getElementById('task-list');
        const taskForm = document.getElementById('task-form');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');

        async function fetchTasks() {
            try {
                const response = await fetch(API_BASE);
                const tasks = await response.json() || [];
                renderTasks(tasks);
            } catch (error) {
                console.error('Error fetching tasks:', error);
                taskList.innerHTML = '<div class="text-red-500 p-4 bg-red-50 rounded-lg">Failed to load tasks. Check console for details.</div>';
            }
        }

        function renderTasks(tasks) {
            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                        <p class="text-slate-400">No tasks found. Create your first one!</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="task-card bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-1">
                            <h3 class="font-semibold text-slate-900">${task.title}</h3>
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusClasses(task.status)} uppercase tracking-wider">
                                ${task.status.replace('_', ' ')}
                            </span>
                        </div>
                        <p class="text-slate-600 text-sm line-clamp-2">${task.description || 'No description'}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editTask(${task.id})" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button onclick="deleteTask(${task.id})" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getStatusClasses(status) {
            switch(status) {
                case 'new': return 'bg-blue-50 text-blue-600 border border-blue-100';
                case 'in_progress': return 'bg-amber-50 text-amber-600 border border-amber-100';
                case 'done': return 'bg-emerald-50 text-emerald-600 border border-emerald-100';
                default: return 'bg-slate-50 text-slate-600';
            }
        }

        function toggleModal(show, title = 'Create Task') {
            modal.classList.toggle('hidden', !show);
            modalTitle.textContent = title;
            if (!show) taskForm.reset();
        }

        async function editTask(id) {
            try {
                const response = await fetch(`${API_BASE}/${id}`);
                const task = await response.json();
                document.getElementById('task-id').value = task.id;
                document.getElementById('title').value = task.title;
                document.getElementById('description').value = task.description;
                document.getElementById('status').value = task.status;
                toggleModal(true, 'Edit Task');
            } catch (error) {
                console.error('Error fetching task details:', error);
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            try {
                await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                fetchTasks();
            } catch (error) {
                console.error('Error deleting task:', error);
            }
        }

        taskForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const data = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                status: document.getElementById('status').value
            };

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_BASE}/${id}` : API_BASE;
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                toggleModal(false);
                fetchTasks();
            } catch (error) {
                console.error('Error saving task:', error);
            }
        };

        // Initial load
        fetchTasks();
    </script>
</body>
</html>
